[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
cetz-compile = { path = "crates/compile" }
cetz-scene = { path = "crates/scene" }
typst-syntax = "0.15.1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true

# Typst compiling CeTZ is slow unoptimized; the compile tests run every
# fixture and example through it.
[profile.dev.package."*"]
opt-level = 2
